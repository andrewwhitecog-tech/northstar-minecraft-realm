name: Private Minecraft promo source QC and conform
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Two manual phases; conform requires reviewed source-QC ZIP approval in manifest
        type: choice
        required: true
        options: [source-qc, conform]
      reviewed_sha:
        description: Exact Root-reviewed current main commit, separate from earlier canary SHA
        type: string
        required: true
permissions: {}
concurrency:
  group: private-minecraft-promo-v16
  cancel-in-progress: false
jobs:
  private-media:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'andrewwhitecog-tech/northstar-minecraft-realm' &&
      github.repository_owner == 'andrewwhitecog-tech' &&
      github.actor == 'andrewwhitecog-tech' &&
      github.triggering_actor == 'andrewwhitecog-tech' &&
      github.event.repository.private == false &&
      github.event.repository.default_branch == 'main' &&
      github.ref == 'refs/heads/main' &&
      github.sha == inputs.reviewed_sha &&
      github.workflow_sha == inputs.reviewed_sha &&
      github.workflow_ref == 'andrewwhitecog-tech/northstar-minecraft-realm/.github/workflows/private-media-conform.yml@refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write # SAME unpublished draft assets; never publish/edit/delete release.
      actions: read # Verify prior canary/source-QC successful run identity.
    env:
      UV_PYTHON_DOWNLOADS: never
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.10.4'
          enable-cache: false
          save-cache: false
          restore-cache: false
      - name: Guard/source unit tests only; no media or network
        working-directory: tools/private_media_conform
        run: nice -n 19 uv run --no-project --python 3.12 python -B -m unittest discover -s tests -v
      - name: Check clean reviewed source
        run: git diff --exit-code
      - name: Bounded official Ubuntu dependencies
        timeout-minutes: 5
        env:
          # Native: xvfb mesa-utils libgl1-mesa-dri libglx-mesa0
          # Media: ffmpeg
          NSP_APT_PACKAGES: 'ffmpeg'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CI" == true && "$GITHUB_ACTIONS" == true && "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$ImageOS" == ubuntu24 ]]
          [[ "$GITHUB_REPOSITORY" == andrewwhitecog-tech/northstar-minecraft-realm && "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          case "$NSP_APT_PACKAGES" in
            'xvfb mesa-utils libgl1-mesa-dri libglx-mesa0') packages=(xvfb mesa-utils libgl1-mesa-dri libglx-mesa0) ;;
            ffmpeg) packages=(ffmpeg) ;;
            *) echo 'UNREVIEWED_PACKAGE_SET'; exit 2 ;;
          esac
          network_ok=1
          for host in archive.ubuntu.com security.ubuntu.com; do
            echo "DNS_IPV4 $host"
            if ! timeout 8s getent ahostsv4 "$host"; then echo "DNS_FAILED $host"; network_ok=0; continue; fi
            suite=noble
            [[ "$host" != security.ubuntu.com ]] || suite=noble-security
            if ! curl -4 --proto '=https' --fail --silent --show-error --connect-timeout 8 --max-time 20 --retry 0 --output /dev/null --write-out 'http=%{http_code} ip=%{remote_ip} seconds=%{time_total}\n' "https://$host/ubuntu/dists/$suite/InRelease"; then echo "HTTPS_FAILED $host"; network_ok=0; fi
          done
          [[ "$network_ok" == 1 ]] || { echo 'OFFICIAL_ARCHIVE_NETWORK_FAILED'; exit 2; }
          test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg
          aptstate=$(mktemp -d "$RUNNER_TEMP/nsp-official-apt.XXXXXX")
          chmod 755 "$aptstate"
          mkdir -p "$aptstate/lists/partial" "$aptstate/sources.empty"
          printf '%s\n' \
            'deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe' \
            'deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe' \
            'deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe' > "$aptstate/official.list"
          apt_options=(
            -o "Dir::Etc::sourcelist=$aptstate/official.list"
            -o "Dir::Etc::sourceparts=$aptstate/sources.empty"
            -o "Dir::State::lists=$aptstate/lists"
            -o Acquire::ForceIPv4=true -o Acquire::Retries=0
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
            -o Acquire::Languages=none
          )
          timeout 100s sudo nice -n 19 apt-get "${apt_options[@]}" --error-on=any update
          timeout 120s sudo env DEBIAN_FRONTEND=noninteractive nice -n 19 apt-get "${apt_options[@]}" install -y --no-install-recommends "${packages[@]}"
          # Real GLX/Minecraft or FFmpeg QC follows; package success is not acceptance.
      - name: Manual private technical phase
        working-directory: tools/private_media_conform
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          MEDIA_PHASE: ${{ inputs.phase }}
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: nice -n 19 uv run --no-project --python 3.12 python -B cloud_worker.py --phase "$MEDIA_PHASE" --reviewed-sha "$REVIEWED_SHA" --config media-config.json
