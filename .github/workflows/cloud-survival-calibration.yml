name: Reviewed real survival calibration
on:
  workflow_dispatch:
    inputs:
      reviewed_payload_sha256:
        description: Root-reviewed tools/cloud_survival_calibration/PAYLOAD.json SHA256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: real-survival-calibration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  real-client-calibration:
    if: github.repository == 'andrewwhitecog-tech/northstar-minecraft-realm' && github.event.repository.private == false && github.ref == 'refs/heads/main' && github.actor == 'andrewwhitecog-tech'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      UV_PYTHON_DOWNLOADS: never
      NSP_PUBLIC_REPOSITORY: 'true'
      NSP_ALLOW_CLOUD_SURVIVAL_CALIBRATION: '1'
      REVIEWED_PAYLOAD_SHA256: ${{ inputs.reviewed_payload_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.10.4'
          enable-cache: false
          save-cache: false
          restore-cache: false
      - name: Bounded official Ubuntu dependencies
        timeout-minutes: 5
        env:
          # Native: xvfb mesa-utils libgl1-mesa-dri libglx-mesa0
          # Media: ffmpeg
          NSP_APT_PACKAGES: 'xvfb mesa-utils libgl1-mesa-dri libglx-mesa0'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CI" == true && "$GITHUB_ACTIONS" == true && "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$ImageOS" == ubuntu24 ]]
          [[ "$GITHUB_REPOSITORY" == andrewwhitecog-tech/northstar-minecraft-realm && "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          case "$NSP_APT_PACKAGES" in
            'xvfb mesa-utils libgl1-mesa-dri libglx-mesa0') packages=(xvfb mesa-utils libgl1-mesa-dri libglx-mesa0) ;;
            ffmpeg) packages=(ffmpeg) ;;
            *) echo 'UNREVIEWED_PACKAGE_SET'; exit 2 ;;
          esac
          network_ok=1
          for host in archive.ubuntu.com security.ubuntu.com; do
            echo "DNS_IPV4 $host"
            if ! timeout 8s getent ahostsv4 "$host"; then echo "DNS_FAILED $host"; network_ok=0; continue; fi
            suite=noble
            [[ "$host" != security.ubuntu.com ]] || suite=noble-security
            if ! curl -4 --proto '=https' --fail --silent --show-error --connect-timeout 8 --max-time 20 --retry 0 --output /dev/null --write-out 'http=%{http_code} ip=%{remote_ip} seconds=%{time_total}\n' "https://$host/ubuntu/dists/$suite/InRelease"; then echo "HTTPS_FAILED $host"; network_ok=0; fi
          done
          [[ "$network_ok" == 1 ]] || { echo 'OFFICIAL_ARCHIVE_NETWORK_FAILED'; exit 2; }
          test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg
          aptstate=$(mktemp -d "$RUNNER_TEMP/nsp-official-apt.XXXXXX")
          chmod 755 "$aptstate"
          mkdir -p "$aptstate/lists/partial" "$aptstate/sources.empty"
          printf '%s\n' \
            'deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe' \
            'deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe' \
            'deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe' > "$aptstate/official.list"
          apt_options=(
            -o "Dir::Etc::sourcelist=$aptstate/official.list"
            -o "Dir::Etc::sourceparts=$aptstate/sources.empty"
            -o "Dir::State::lists=$aptstate/lists"
            -o Acquire::ForceIPv4=true -o Acquire::Retries=0
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
            -o Acquire::Languages=none
          )
          timeout 100s sudo nice -n 19 apt-get "${apt_options[@]}" --error-on=any update
          timeout 120s sudo env DEBIAN_FRONTEND=noninteractive nice -n 19 apt-get "${apt_options[@]}" install -y --no-install-recommends "${packages[@]}"
          # Real GLX/Minecraft or FFmpeg QC follows; package success is not acceptance.
      - name: Actual source checks only
        working-directory: tools/cloud_survival_calibration
        run: uv run --no-project --python 3.12 test_source.py
      - name: Validate exact reviewed public payload
        working-directory: tools/cloud_survival_calibration
        run: uv run --no-project --python 3.12 native_calibration.py --reviewed-payload-sha256 "$REVIEWED_PAYLOAD_SHA256"
      - name: Real Fabric client plus Flan server on own Xvfb display
        working-directory: tools/cloud_survival_calibration
        run: uv run --no-project --python 3.12 native_calibration.py --execute --reviewed-payload-sha256 "$REVIEWED_PAYLOAD_SHA256"
# Deliberately no cache or upload-artifact action, no secrets and no PR/push auto-trigger.
# Missing Xvfb/libGL or a failed real Minecraft renderer is a measured blocker, never a mock pass.
