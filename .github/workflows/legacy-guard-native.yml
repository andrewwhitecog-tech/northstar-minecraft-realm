name: Real isolated Legacy guard smoke
on:
  pull_request:
    paths:
      - 'tools/legacy_guard_native/**'
      - 'tools/walk_harness_compile/**'
      - '.github/workflows/legacy-guard-native.yml'
permissions:
  contents: read
concurrency:
  group: legacy-guard-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-trim:
    if: github.repository == 'andrewwhitecog-tech/northstar-minecraft-realm' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.10.4'
          enable-cache: false
          save-cache: false
          restore-cache: false
      - name: Execute actual source and transport regression checks
        working-directory: tools/legacy_guard_native
        run: uv run --no-project --python 3.12 test_source.py
      - name: Validate reviewed source payload without starting a server
        working-directory: tools/legacy_guard_native
        run: uv run --no-project --python 3.12 ci_runner.py --reviewed-payload-sha256 934e8bbdd729af27412ecd001204930864ed072988563657baf5e85c2e64def9
      - name: Execute two genuine native cases and six-site latency samples
        working-directory: tools/legacy_guard_native
        run: uv run --no-project --python 3.12 ci_runner.py --ci --execute --reviewed-payload-sha256 934e8bbdd729af27412ecd001204930864ed072988563657baf5e85c2e64def9 --benchmark-iterations 1
  compile-walk-harness:
    if: github.repository == 'andrewwhitecog-tech/northstar-minecraft-realm' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NSP_ALLOW_PUBLIC_CLOUD_JAVAC: '1'
      NSP_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - name: Execute source and host-guard regressions
        working-directory: tools/walk_harness_compile
        run: node --test test/payload.test.mjs
      - name: Compile exact held-mining candidate and emit own-code JAR through job logs
        working-directory: tools/walk_harness_compile
        run: node cloud-compile.mjs --compile
