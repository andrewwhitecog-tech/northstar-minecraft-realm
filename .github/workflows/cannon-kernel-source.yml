name: Cannon kernel offline source and build
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/cannon_kernel/**'
      - '.github/workflows/cannon-kernel-source.yml'
permissions:
  contents: read
concurrency:
  group: cannon-kernel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  source-build:
    if: github.repository == 'andrewwhitecog-tech/northstar-minecraft-realm'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out this exact workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build generic cannon pack and run actual portable unittest
        id: offline
        run: |
          python3 --version
          python3 -B tools/cannon_kernel/run_source_checks.py --execute --output "$RUNNER_TEMP/cannon-kernel-source"
      - name: Confirm tracked source is unchanged
        if: always()
        run: git diff --exit-code
      - name: Preserve small source-only pack and actual test evidence
        if: always() && steps.offline.outputs.upload_allowed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cannon-kernel-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cannon-kernel-source
          retention-days: 1
          if-no-files-found: error
          compression-level: 6
          include-hidden-files: false
