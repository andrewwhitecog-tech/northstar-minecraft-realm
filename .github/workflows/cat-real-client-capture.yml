name: Reviewed real cat client capture
on:
  pull_request:
    branches: [main]
    paths:
      - tools/cat_client_capture/**
      - .github/workflows/cat-real-client-capture.yml
  workflow_dispatch:
    inputs:
      capture_preset:
        description: Explicit native capture qualification preset
        required: true
        type: choice
        options:
          - hero720
          - close800
      capture_phases:
        description: Exact private component coverage (protected reuses no old pass)
        required: true
        default: all
        type: choice
        options:
          - all
          - protected
      expected_commit:
        description: Exact reviewed public main commit
        required: true
        type: string
      reviewed_capture_sha256:
        description: CAPTURE_SOURCE.json SHA256
        required: true
        type: string
      reviewed_cat_sha256:
        description: Current cat PUBLIC_SOURCE.json SHA256
        required: true
        type: string
      reviewed_native_sha256:
        description: Current cat NATIVE_SOURCE.json SHA256
        required: true
        type: string
      reviewed_coat_source_sha256:
        description: Current menagerie PUBLIC_EXPORT_SOURCE.json SHA256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cat-real-client-capture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-compile:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - name: Actual pinned source guards
        run: |
          python3 -B - <<'PY'
          import ast,hashlib,importlib.util,pathlib
          p=pathlib.Path('tools/cat_client_capture/capture_client.py');ast.parse(p.read_text())
          s=importlib.util.spec_from_file_location('capture',p);m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          m.source_guard(sha('tools/cat_client_capture/CAPTURE_SOURCE.json'),sha('tools/cat_instincts/PUBLIC_SOURCE.json'),sha('tools/cat_instincts/NATIVE_SOURCE.json'))
          PY
      - name: Actual strict input and offline-record regression tests
        run: python3 -B -m unittest discover -s tools/cat_client_capture -p "test_*.py" -v
      - name: Actual source build and JUnit for pinned client classpath
        run: python3 -B tools/cat_instincts/portable_build.py --execute --expected-commit "$GITHUB_SHA" --output "$RUNNER_TEMP/capture-source-compile"
      - name: Compile observer and unique recorder; execute recorder JUnit8
        run: |
          python3 -B - <<'PY'
          import os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'capture-source-compile';jars=sorted((root/'dependencies').rglob('*.jar'));assert jars
          out=root/'observer-classes';out.mkdir()
          subprocess.run(['javac','-J-XX:ActiveProcessorCount=2','-J-Xmx512M','--release','25','-encoding','UTF-8','-proc:none','-cp',os.pathsep.join(map(str,jars)),'-d',str(out),'tools/cat_client_capture/src/net/northstar/capture/CaptureObserverMixin.java'],check=True,timeout=120)
          print('Actual observer javac completed; native execution not run')
          # Reuse ONLY the already downloaded, pinned client/JUnit dependencies.
          import json,xml.etree.ElementTree as ET
          recorder=root/'recorder-classes';recorder.mkdir();tests=root/'recorder-tests';tests.mkdir()
          cp=os.pathsep.join(map(str,jars))
          subprocess.run(['javac','-J-XX:ActiveProcessorCount=2','-J-Xmx512M','--release','25','-encoding','UTF-8','-proc:none','-cp',cp,'-d',str(recorder),'tools/cat_client_capture/harness/src/nsp/walk/FrameRecorder.java'],check=True,timeout=120)
          testcp=str(recorder)+os.pathsep+cp
          subprocess.run(['javac','-J-XX:ActiveProcessorCount=2','-J-Xmx512M','--release','25','-encoding','UTF-8','-proc:none','-cp',testcp,'-d',str(tests),'tools/cat_client_capture/harness/tests/nsp/walk/FrameRecorderUniqueWriterTest.java'],check=True,timeout=120)
          xml=root/'recorder-junit';run=subprocess.run(['java','-XX:ActiveProcessorCount=2','-Xmx512M','-Djava.awt.headless=true','-cp',str(tests)+os.pathsep+testcp,'org.junit.platform.console.ConsoleLauncher','execute','--select-class','nsp.walk.FrameRecorderUniqueWriterTest','--reports-dir',str(xml),'--fail-if-no-tests','--disable-banner','--details=tree'],timeout=60)
          reports=list(xml.glob('TEST-*.xml'));assert reports,'Actual recorder JUnit XML missing'
          counts={k:sum(int(ET.parse(p).getroot().attrib[k])for p in reports)for k in ['tests','failures','errors','skipped']}
          (root/'recorder-junit-actual.json').write_text(json.dumps({'exitCode':run.returncode,'actual':counts},indent=2)+'\n')
          print('Actual recorder JUnit',counts)
          assert run.returncode==0 and counts=={'tests':8,'failures':0,'errors':0,'skipped':0},'Actual recorder JUnit8 did not pass'
          print('Actual recorder source/JUnit completed; native execution not run')
          PY
  cinematic-source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - name: Compile complete cinematic source and run actual JUnit39 and stdlib4
        id: cinematic
        run: python3 -B tools/cat_client_capture/cinematic/portable_build.py --execute --expected-commit "$GITHUB_SHA" --output "$RUNNER_TEMP/cinematic-source"
      - name: Retain bounded source-only build and actual test evidence
        if: always() && steps.cinematic.outputs.upload_allowed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cinematic-source-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cinematic-source/evidence
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
  client-capture:
    if: github.repository == 'andrewwhitecog-tech/northstar-minecraft-realm' && github.event.repository.private == false && github.ref == 'refs/heads/main' && github.actor == 'andrewwhitecog-tech'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      UV_PYTHON_DOWNLOADS: never
      NSP_PUBLIC_REPOSITORY: 'true'
      NSP_ALLOW_CLOUD_SURVIVAL_CALIBRATION: '1'
      CAPTURE_PRESET: ${{ inputs.capture_preset }}
      CAPTURE_PHASES: ${{ inputs.capture_phases }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CAPTURE_SHA: ${{ inputs.reviewed_capture_sha256 }}
      CAT_SHA: ${{ inputs.reviewed_cat_sha256 }}
      NATIVE_SHA: ${{ inputs.reviewed_native_sha256 }}
      COAT_SHA: ${{ inputs.reviewed_coat_source_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - name: Source and exact hosted dispatch guard before downloads
        run: |
          python3 -B - <<'PY'
          import ast,hashlib,importlib.util,os,pathlib
          path=pathlib.Path('tools/cat_client_capture/capture_client.py');ast.parse(path.read_text())
          s=importlib.util.spec_from_file_location('capture',path);m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          n=m.source_guard(os.environ['CAPTURE_SHA'],os.environ['CAT_SHA'],os.environ['NATIVE_SHA'])
          n.hosted_guard(os.environ['EXPECTED_COMMIT'])
          assert hashlib.sha256(pathlib.Path('tools/cat_menagerie/PUBLIC_EXPORT_SOURCE.json').read_bytes()).hexdigest()==os.environ['COAT_SHA']
          PY
      - name: Actual source-built behavior mod and real JUnit
        id: build
        run: python3 -B tools/cat_instincts/portable_build.py --execute --expected-commit "$EXPECTED_COMMIT" --output "$RUNNER_TEMP/cat-client-source"
      - name: Actual original coat export and source-compiled Java candidate pack
        id: coats
        run: python3 -B tools/cat_menagerie/run_hosted_export.py --execute --out "$RUNNER_TEMP/cat-coat-original-export"
      - name: Actual four improved COMPAT coat adoption
        run: python3 -B tools/cat_native_representatives/adapt_representatives.py --execute --reviewed-adapter-sha256 d78211fb89d61bca3c7e5b92532c65d0fe7a53fe50a1d4266af8bb8700a2af0b --original-pack "$RUNNER_TEMP/cat-coat-original-export/game_pack_candidate"
      - name: Prepare missing disposable hosted media/display tools
        run: |
          packages=()
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then packages+=(ffmpeg); fi
          if ! command -v Xvfb >/dev/null; then packages+=(xvfb); fi
          if [ ${#packages[@]} -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends "${packages[@]}"
          fi
          command -v java javac ffmpeg ffprobe Xvfb
      - name: Actual real client, custom coats and original framebuffer capture
        id: capture
        run: python3 -B tools/cat_client_capture/capture_client.py --execute --capture-preset "$CAPTURE_PRESET" --capture-phases "$CAPTURE_PHASES" --expected-commit "$EXPECTED_COMMIT" --reviewed-capture-sha256 "$CAPTURE_SHA" --reviewed-cat-sha256 "$CAT_SHA" --reviewed-native-sha256 "$NATIVE_SHA" --reviewed-coat-source-sha256 "$COAT_SHA" --cat-build-receipt "$RUNNER_TEMP/cat-client-source/evidence/BUILD_TEST_ACTUAL.json" --coat-build-receipt "$RUNNER_TEMP/cat-coat-original-export/game_pack_candidate/BUILD_ACTUAL.json" --representative-build-receipt "$GITHUB_WORKSPACE/tools/cat_native_representatives/native_representative_pack_v01/BUILD_ACTUAL.json" --reviewed-representative-adapter-sha256 d78211fb89d61bca3c7e5b92532c65d0fe7a53fe50a1d4266af8bb8700a2af0b --output "$GITHUB_WORKSPACE/cat-client-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Check tracked source remains unchanged
        if: always()
        run: git diff --exit-code
      - name: Actual bounded private review footage, frames and original logs
        if: always() && steps.capture.outputs.upload_allowed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cat-real-client-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/cat-client-${{ github.run_id }}-${{ github.run_attempt }}/evidence
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
      - name: Actual source build receipt and candidate JAR
        if: always() && steps.build.outputs.upload_allowed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cat-client-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cat-client-source/evidence
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
