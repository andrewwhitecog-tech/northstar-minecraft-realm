name: Reviewed graphics environment diagnostic
on:
  workflow_dispatch:
    inputs:
      reviewed_commit_sha:
        description: Exact reviewed main commit
        required: true
        type: string
      reviewed_payload_sha256:
        description: Exact reviewed calibration PAYLOAD.json SHA256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: minecraft-graphics-environment
  cancel-in-progress: false
jobs:
  graphics-environment:
    if: >-
      github.repository == 'andrewwhitecog-tech/northstar-minecraft-realm' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'andrewwhitecog-tech' &&
      github.triggering_actor == 'andrewwhitecog-tech' &&
      github.sha == inputs.reviewed_commit_sha &&
      github.workflow_sha == inputs.reviewed_commit_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      UV_PYTHON_DOWNLOADS: never
      NSP_PUBLIC_REPOSITORY: 'true'
      NSP_ALLOW_CLOUD_SURVIVAL_CALIBRATION: '1'
      REVIEWED_PAYLOAD_SHA256: ${{ inputs.reviewed_payload_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.10.4'
          enable-cache: false
          save-cache: false
          restore-cache: false
      - name: Pure source and guard checks
        working-directory: tools/cloud_survival_calibration
        run: uv run --no-project --python 3.12 python -B -m unittest -v test_source test_probe_source test_sdl_probe_source test_graphics_environment
      - name: Exact reviewed source payload; no native execution
        working-directory: tools/cloud_survival_calibration
        run: uv run --no-project --python 3.12 python -B native_calibration.py --reviewed-payload-sha256 "$REVIEWED_PAYLOAD_SHA256"
      - name: Observe isolated existing graphics libraries and pinned SDL only
        working-directory: tools/cloud_survival_calibration
        run: uv run --no-project --python 3.12 python -B graphics_environment.py --execute --reviewed-payload-sha256 "$REVIEWED_PAYLOAD_SHA256"
# No Minecraft server/client, package installation, cache, artifact upload or workstation access.
