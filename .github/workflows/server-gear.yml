name: NorthStar server gear prototype
on:
  push:
    branches: ["codex/server-gear-prototype-20261030"]
concurrency:
  group: northstar-server-gear-prototype
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server-gear
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Reuse exact compiled JAR after unchanged-source guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin 0c230590058d81ff872d5cb62602ebe38be5cd6f
          git diff --exit-code 0c230590058d81ff872d5cb62602ebe38be5cd6f HEAD -- src build.gradle gradle.properties settings.gradle gradlew gradlew.bat gradle
          gh run download 41036002893 --repo ${{ github.repository }} --name northstar-server-gear-ci --dir build
          sha256sum build/libs/northstar-server-gear-0.1.0-prototype.jar
      - name: Upload reused JAR and its original JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: northstar-server-gear-ci
          retention-days: 1
          path: |
            server-gear/build/libs/*.jar
            server-gear/build/test-results/test/*.xml
            server-gear/build/reports/tests/test/**
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned protocol clients
        working-directory: server-gear/protocol_tests
        run: |
          git config --global url.https://github.com/.insteadOf ssh://git@github.com/
          npm ci --ignore-scripts --no-audit --no-fund
          node prepare_native.cjs
      - name: Test real Java and Bedrock inventories on an isolated world copy
        run: python3 -u ci/run_gear_protocol.py
      - name: Upload safe protocol results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: northstar-gear-protocol-ci
          retention-days: 1
          path: |
            server-gear/CI_PROTOCOL_ACTUAL.json
            server-gear/CI_COMMANDS_ACTUAL.json
            server-gear/BEDROCK_PACKET_EVIDENCE.json
            server-gear/ci_runtime/*.log
            server-gear/ci_runtime/*.tap
